name: Engineering checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-dev.txt -c requirements-lock.txt
      - run: python -m pytest --cov=vera --cov-report=term-missing
      - run: python vendor/magicpin/dataset/generate_dataset.py --seed-dir vendor/magicpin/dataset --out expanded
      - run: python -m scripts.evaluate --dataset expanded
