[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-compass"
version = "1.0.0"
description = "Evidence-backed, stateful merchant engagement challenge entry"
requires-python = ">=3.11"
dependencies = ["fastapi==0.128.2", "uvicorn==0.48.0", "pydantic==2.13.4", "httpx==0.28.1", "tzdata==2026.2"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-cov==7.0.0"]

[tool.setuptools]
packages = ["vera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["vera"]
branch = true

[tool.coverage.report]
show_missing = true
