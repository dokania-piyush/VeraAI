services:
  vera:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      VERA_DB_PATH: /app/data/vera.sqlite3
    volumes:
      - vera-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  vera-data:
